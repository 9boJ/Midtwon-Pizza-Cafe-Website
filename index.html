<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midtown Pizza & Cafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>

<header>
    <div class="hero-inner">
        <div class="hero-text">
            <h1>Midtown Pizza & Cafe</h1>
            <p>Family-owned pizza, poutines, and cafe in the heart of Lougheed.</p>
            <div class="hero-actions">
                <a href="#menu-section" class="btn btn-primary">View Our Menu</a>
                <a href="#contact-section" class="btn btn-outline">Hours & Facebook</a>
            </div>
        </div>
        <div class="hero-illustration" aria-hidden="true">
            <img src="img/pizza.svg" alt="" class="hero-icon hero-icon--pizza">
            <img src="img/burger.svg" alt="" class="hero-icon hero-icon--burger">
            <img src="img/drink.svg" alt="" class="hero-icon hero-icon--drink">
        </div>
    </div>
</header>

<main>
    <section id="menu-section">
        <h2>Our Menu</h2>
        <div id="menu-container"></div>
    </section>
</main>


<section class="map-container">
    <h2>Find Us in Lougheed</h2>
    <div class="responsive-map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2385.947514304856!2d-111.4423456!3d52.8277981!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53093952382f7e03%3A0xc66519f7f45a2789!2s5007%2051%20Ave%2C%20Lougheed%2C%20AB%20T0B%202V0!5e0!3m2!1sen!2sca!4v1700000000000"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</section>

<footer id="contact-section">
    <div id="contact-container">
    </div>
    <p>&copy; 2026 Midtown Pizza & Cafe</p>
</footer>

<script src="js/script.js"></script>
<script src="js/lodeContact.js"></script>
</body>
</html>
