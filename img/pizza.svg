<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Pizza slice illustration</title>
  <desc id="desc">A stylized pizza slice with cheese and pepperoni.</desc>
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcc80" />
      <stop offset="1" stop-color="#ffb74d" />
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082" />
      <stop offset="1" stop-color="#ffca28" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#b71c1c" />
  <!-- Slice crust -->
  <path d="M15 30 L105 30 L60 110 Z" fill="url(#crust)" stroke="#8d6e63" stroke-width="3" />
  <!-- Cheese -->
  <path d="M22 32 L96 32 L60 100 Z" fill="url(#cheese)" />
  <!-- Sauce edge -->
  <path d="M26 34 L92 34" stroke="#d32f2f" stroke-width="4" stroke-linecap="round" />
  <!-- Pepperoni -->
  <circle cx="52" cy="52" r="6.5" fill="#d32f2f" />
  <circle cx="72" cy="60" r="6.5" fill="#d32f2f" />
  <circle cx="44" cy="70" r="5.5" fill="#d32f2f" />
  <!-- Basil leaves -->
  <ellipse cx="64" cy="46" rx="4" ry="7" fill="#66bb6a" transform="rotate(-20 64 46)" />
  <ellipse cx="38" cy="60" rx="3.5" ry="6.5" fill="#66bb6a" transform="rotate(18 38 60)" />
</svg>
